# Trigger Render endpoint for prayer notifications
# Separate from schedule.yml (which runs locally in GitHub Actions)

name: Trigger Render Scheduler

on:
  repository_dispatch:
    types: [pray-notify-render]
  workflow_dispatch:
    inputs:
      prayer:
        description: Shalat window
        required: true
        type: choice
        options:
          - subuh
          - dhuha
          - dzuhur
          - ashar
          - maghrib
          - isya
      test:
        description: Test mode (no actual sends)
        type: boolean
        default: false

concurrency:
  group: pray-notify-render-${{ github.event.client_payload.prayer || github.event.inputs.prayer }}
  cancel-in-progress: false

jobs:
  trigger-render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate prayer
        env:
          PRAYER: ${{ github.event.client_payload.prayer || github.event.inputs.prayer }}
        run: |
          case "$PRAYER" in
            subuh|dhuha|dzuhur|ashar|maghrib|isya) echo "Prayer: $PRAYER" ;;
            *) echo "PRAYER tidak valid: '$PRAYER'" && exit 1 ;;
          esac

      - name: Trigger Render /run endpoint
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
          PRAYER: ${{ github.event.client_payload.prayer || github.event.inputs.prayer }}
          TEST_MODE: ${{ github.event.inputs.test || 'false' }}
        run: |
          URL="${RENDER_URL}/run?prayer=${PRAYER}&test=${TEST_MODE}"
          echo "🚀 Triggering Render: $URL"
          response=$(curl -X POST "$URL" -w "\nHTTP: %{http_code}" -sSf) || {
            echo "⚠️ Trigger failed (service may be sleeping): $response"
            exit 0  # Don't fail workflow
          }
          echo "✅ Response: $response"

      - name: Log completion
        run: echo "✅ Triggered Render for $PRAYER at $(date -u)"
