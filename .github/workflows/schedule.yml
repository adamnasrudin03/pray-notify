# Dipicu cron-job.org via repository_dispatch.
# https://console.cron-job.org → POST /repos/{owner}/{repo}/dispatches

name: Prayer Notification

on:
  repository_dispatch:
    types: [pray-notify]
  workflow_dispatch:

concurrency:
  group: pray-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"

      - name: Build Go Program
        run: go build -o prayer-notifier main.go

      - name: Run Prayer Notifier
        run: ./prayer-notifier
        env:
          WEBHOOK_TARGETS: ${{ secrets.WEBHOOK_TARGETS }}
