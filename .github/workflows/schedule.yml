# Manual test saja — JANGAN dipicu cron (hemat kuota GitHub Actions Free).
# Production: cron-job.org → HTTP /notify (lihat cmd/serve & deploy/cron-job.org.md)

name: Prayer Notification (Manual)

on:
  workflow_dispatch:

concurrency:
  group: pray-notify-manual
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"
          cache: true

      - name: Build Go Program
        run: go build -o prayer-notifier main.go

      - name: Run Prayer Notifier
        run: ./prayer-notifier
        env:
          WEBHOOK_TARGETS: ${{ secrets.WEBHOOK_TARGETS }}
