# Production: cron-job.org 6×/hari → repository_dispatch → calls Render /run endpoint
# Repo disarankan PUBLIC agar kuota GitHub Actions Free cukup (~120 menit/hari).

name: Prayer Notification

on:
  repository_dispatch:
    types: [pray-notify]
  workflow_dispatch:
    inputs:
      prayer:
        description: Shalat window
        required: true
        type: choice
        options:
          - subuh
          - dhuha
          - dzuhur
          - ashar
          - maghrib
          - isya

concurrency:
  group: pray-notify-${{ github.event.client_payload.prayer || github.event.inputs.prayer }}
  cancel-in-progress: false

jobs:
  trigger-render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate prayer
        env:
          PRAYER: ${{ github.event.client_payload.prayer || github.event.inputs.prayer }}
        run: |
          case "$PRAYER" in
            subuh|dhuha|dzuhur|ashar|maghrib|isya) echo "Prayer: $PRAYER" ;;
            *) echo "PRAYER tidak valid: '$PRAYER'" && exit 1 ;;
          esac

      - name: Trigger Render /run endpoint
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
          PRAYER: ${{ github.event.client_payload.prayer || github.event.inputs.prayer }}
        run: |
          URL="${RENDER_URL}/run?prayer=${PRAYER}"
          echo "🚀 Triggering Render: $URL"
          response=$(curl -X POST "$URL" -w "\nHTTP: %{http_code}" -sSf) || {
            echo "⚠️ Trigger failed (service may be sleeping): $response"
            exit 0  # Don't fail workflow - cron-job.org will retry
          }
          echo "✅ Response: $response"

      - name: Log completion
        run: echo "✅ Triggered Render for $PRAYER at $(date -u)"
