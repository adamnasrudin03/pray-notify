# Production: cron-job.org 6×/hari → repository_dispatch → loop sleep per offset.
# Repo disarankan PUBLIC agar kuota GitHub Actions Free cukup (~120 menit/hari).

name: Prayer Notification

on:
  repository_dispatch:
    types: [pray-notify]
  workflow_dispatch:
    inputs:
      prayer:
        description: Shalat window
        required: true
        type: choice
        options:
          - subuh
          - dhuha
          - dzuhur
          - ashar
          - maghrib
          - isya

concurrency:
  group: pray-notify-${{ github.event.client_payload.prayer || github.event.inputs.prayer }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate prayer
        env:
          PRAYER: ${{ github.event.client_payload.prayer || github.event.inputs.prayer }}
        run: |
          case "$PRAYER" in
            subuh|dhuha|dzuhur|ashar|maghrib|isya) echo "Prayer: $PRAYER" ;;
            *) echo "PRAYER tidak valid: '$PRAYER'" && exit 1 ;;
          esac

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Build
        run: go build -o prayer-notifier main.go

      - name: Run Prayer Window
        env:
          WEBHOOK_TARGETS: ${{ secrets.WEBHOOK_TARGETS }}
          PRAYER: ${{ github.event.client_payload.prayer || github.event.inputs.prayer }}
        run: ./prayer-notifier -prayer "$PRAYER"
