name: Prayer Notification Cron

on:
  schedule:
    # Action akan berjalan setiap 5 menit (misalnya, pukul 0, 5, 10, 15, ..., 55 setiap jam)
    # Ini penting agar kode Go bisa memeriksa notifikasi dalam jendela waktu 5 menit.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    # Memungkinkan eksekusi manual dari UI GitHub

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"

      - name: Build Go Program
        run: go build -o prayer-notifier main.go

      - name: Run Prayer Notifier
        run: ./prayer-notifier

        # Optional: Jika Anda ingin menggunakan GitHub Secrets untuk webhook,
        # ganti baris run di atas dengan:
        # run: ./prayer-notifier
        # env:
        #   WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        # Dan ubah kode Go Anda untuk membaca URL dari environment variable.
