name: Prayer Notification Cron

on:
  schedule:
    # Action akan berjalan setiap 5 menit (misalnya, pukul 0, 5, 10, 15, ..., 55 setiap jam)
    # Ini penting agar kode Go bisa memeriksa notifikasi dalam jendela waktu 5 menit.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    # Memungkinkan eksekusi manual dari UI GitHub

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"

      - name: Build Go Program
        run: go build -o prayer-notifier main.go

      - name: Run Prayer Notifier
        run: ./prayer-notifier
        # Biarkan bagian env di sini kosong atau gunakan saja secrets yang sudah ada.
        # Karena kita akan membaca SEMUA environment variable dari sistem OS.
        # Anda hanya perlu memastikan secrets ini didefinisikan di GitHub:
        # WEBHOOK_URL_UMUM, WEBHOOK_URL_APRAN, WEBHOOK_URL_LAIN, dst.
