name: Trigger Pray Notifications

on:
  # Jalankan setiap 15 menit (03:30-19:59 WIB = 20:30-12:59 UTC)
  # Render free tier sleeps after 15 min inactivity, jadi ini keep-alive + trigger
  schedule:
    - cron: '*/15 20-12 * * *'  # Every 15 min from 20:00-12:59 UTC (03:00-19:59 WIB)
  # Manual trigger
  workflow_dispatch:
    inputs:
      test:
        description: 'Test mode'
        type: boolean
        default: false
      prayer:
        description: 'Specific prayer (subuh, dhuha, dzuhur, ashar, maghrib, isya)'
        type: string
        required: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger scheduler
        run: |
          curl -X POST "${{ secrets.RENDER_URL }}/run?test=${{ github.event.inputs.test || 'false' }}&prayer=${{ github.event.inputs.prayer || '' }}" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_TOKEN }}" \
            -w "\nHTTP: %{http_code}\n" \
            -sSf || echo "⚠️ Trigger failed (service might be sleeping), but cron will retry"
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}

      - name: Log result
        run: echo "✅ Scheduler triggered at $(date -u)"
